name: Feature request
description: Propose new behaviour or a change to existing behaviour.
title: '[Feature]: '
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today, and who is blocked by it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behaviour you want. Sketch the API surface or contract if relevant.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Where does this belong?
      multiple: true
      options:
        - VioletManager.API
        - VioletManager.Application
        - VioletManager.Domain
        - VioletManager.Infrastructure
        - Tests
        - Build / CI / CD
        - Unsure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include "do nothing" if that is a real option.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer decides this is done.
      value: |
        - [ ]
        - [ ]

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This is a breaking change for existing API consumers
        - label: This needs new configuration or secrets
        - label: This needs a database or infrastructure change
